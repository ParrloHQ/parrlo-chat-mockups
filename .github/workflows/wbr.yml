# Разрывы внутри слова в кадрах (checks/wbr.js). Падает на новом разрыве (слово уже экрана) или на строке списка-исключения,
# которой больше нет (checks/wbr-allow.txt только сокращается). GitHub-hosted раннер, без секретов.
name: wbr

on:
  pull_request:
    paths:
      - 'frames/**'
      - '*.css'
      - 'fonts/**'
      - 'redesign-ios/**'
      - 'checks/redesign.js'
      - 'checks/wbr.js'
      - 'checks/wbr-allow.txt'
      - '.github/workflows/wbr.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wbr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wbr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: checks/wbr.js — новых разрывов внутри слова быть не должно
        run: node checks/wbr.js
      - name: checks/redesign.js --wbr — редизайн iOS (разрывы слов и висячие короткие слова), должно быть 0
        run: node checks/redesign.js --wbr
