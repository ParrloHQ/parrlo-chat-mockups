<style>html{background:#0A0C0F}body{padding:24px;margin:0;font:13px Inter,sans-serif;color:#9AA4B2}

.tp-comp{flex-direction:column;align-items:stretch;gap:10px}

.tp-for{display:flex;align-items:center;gap:8px;font:var(--fw-semi) var(--t-small)/1.3 var(--font);color:var(--muted)}
.tp-for .ic{font-size:calc(18px*var(--ts-i));flex:none;color:var(--acc)}
.tp-tr{font:var(--fw-reg) var(--t-lead)/1.45 var(--font);color:#fff;overflow-wrap:break-word}

.vw-pv>.tp-dont{margin:-4px 0 -8px}
.tp-load{display:flex;align-items:center;gap:2px;min-height:calc(var(--t-lead)*1.45*2);font:var(--fw-reg) var(--t-lead)/1.45 var(--font);color:var(--ink)}
.tp-dots{display:inline-flex;gap:4px;margin-left:4px}

.tp-dots i:nth-child(2){animation-delay:.2s}.tp-dots i:nth-child(3){animation-delay:.4s}

.tp-err h3{font:var(--fw-semi) var(--t-body)/1.3 var(--font);color:var(--err)}
.tp-err p{font:var(--fw-reg) var(--t-small)/1.35 var(--font);color:var(--ink);margin-top:2px}

.tp-typed{color:var(--ink)!important}

.tp-hl.tp-fade{animation:tphl 2s ease-out .4s forwards}
@keyframes tphl{to{background:var(--surface);box-shadow:inset 0 0 0 1.5px transparent}}
@media (prefers-reduced-motion:reduce){.tp-hl.tp-fade{animation:none}}
