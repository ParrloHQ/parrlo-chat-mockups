<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><style>
/* фото в чате (группа pick) — стили только этого кадра */
.ph-sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:30;display:flex;flex-direction:column;gap:8px}
.ph-sheet .card{background:var(--surface);border-radius:var(--r-xl);padding:6px 8px 4px;box-shadow:0 0 0 1px var(--line)}
.ph-sheet .grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:2px auto 4px}
.ph-opts{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 4px 4px}
.ph-opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:calc(116px*var(--ts-i));padding:14px 8px;border-radius:var(--r-lg);background:var(--raised);color:var(--ink);font:var(--fw-med) var(--t-body)/1.2 var(--font);text-align:center}
.ph-opt:hover{background:#2C343E}.ph-opt:focus-visible{outline:var(--focus-w) solid var(--focus);outline-offset:-2px}
.ph-opt .ico{width:calc(52px*var(--ts-i));height:calc(52px*var(--ts-i));border-radius:50%;background:var(--selected);color:var(--acc);display:grid;place-items:center;font-size:calc(26px*var(--ts-i));flex:none}
[data-ts=xl] .ph-opts{grid-template-columns:1fr}
[data-ts=xl] .ph-opt{flex-direction:row;justify-content:flex-start;min-height:calc(72px*var(--ts-i));padding:10px 14px;text-align:left;gap:14px}
.ph-lim{font:var(--fw-reg) var(--t-small)/1.35 var(--font);color:var(--muted);text-align:center;padding:8px 12px 10px}
.ph-cancel{background:var(--surface);color:var(--ink);font-weight:var(--fw-semi);box-shadow:0 0 0 1px var(--line)}
.ph-cancel:hover{background:var(--raised)}
@container (min-width:600px){
 .pc-composer-in{position:relative}
 .ph-sheet{left:0;right:auto;bottom:calc(100% + 10px);width:340px}
 .ph-sheet .grab,.ph-sheet .ph-cancel{display:none}
 .ph-sheet .card{border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px var(--line)}
}
/* превью перед отправкой */
.ph-pv{position:absolute;inset:0;z-index:40;background:#07090C;display:flex;flex-direction:column;padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
.ph-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:56px;flex:none}
.ph-bar h2{flex:1;min-width:0;text-align:center;font:var(--fw-semi) var(--t-body)/1.2 var(--font)}
.ph-stage{flex:1 1 auto;min-height:72px;padding:4px 16px 0;display:flex}
.ph-img{flex:1;min-width:0}
.ph-img svg,.ph-th svg{width:100%;height:100%;display:block}
.ph-strip{display:flex;gap:8px;align-items:center;padding:10px 16px 0;flex:none}
.ph-add{flex:none;width:calc(56px*var(--ts-i));height:calc(56px*var(--ts-i));border-radius:var(--r-md);border:1.5px dashed rgba(232,236,241,.5);display:grid;place-items:center;color:var(--ink);font-size:calc(24px*var(--ts-i))}
.ph-add:hover{background:var(--hover)}
.ph-add:disabled{color:#6B7480;border-color:rgba(232,236,241,.2);background:none;cursor:not-allowed}
.ph-sep{flex:none;width:1px;align-self:stretch;margin:6px 0;background:var(--line)}
.ph-thumbs{list-style:none;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:4px}
.ph-thumbs li{flex:none}
.ph-th{position:relative;display:block;width:calc(56px*var(--ts-i));height:calc(56px*var(--ts-i));border-radius:var(--r-md);overflow:hidden;padding:0;opacity:.7}
.ph-th[aria-current=true]{opacity:1;box-shadow:0 0 0 2px #07090C,0 0 0 4px var(--acc)}
.ph-n{position:absolute;top:4px;right:4px;min-width:calc(20px*var(--ts-i));height:calc(20px*var(--ts-i));padding:0 4px;border-radius:var(--r-pill);background:var(--acc);color:var(--ink-0);font:var(--fw-semi) calc(12px*(1 + (var(--ts-s) - 1)*.5))/calc(20px*var(--ts-i)) var(--font);text-align:center;box-shadow:0 0 0 1.5px #07090C}
.ph-hint{display:flex;gap:10px;align-items:flex-start;margin:10px 16px 0;padding:10px 12px;border-radius:var(--r-md);background:var(--info-bg);color:var(--ink);font:var(--fw-reg) var(--t-small)/1.35 var(--font);flex:none}
.ph-hint .ic{color:var(--info);font-size:calc(18px*var(--ts-i));margin-top:1px}
.ph-cap{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 12px;flex:none}
.ph-cap .in{flex:1;min-width:0;display:flex;align-items:center;min-height:52px;padding:12px 18px;border-radius:26px;background:var(--glass);color:var(--muted);font:var(--fw-reg) var(--t-body)/1.25 var(--font)}
.ph-send{position:relative;width:52px;height:52px;background:var(--btn);color:var(--on-btn);font-size:24px}
.ph-send:hover{background:var(--btn-hover)}
.ph-send .pc-badge{position:absolute;top:-6px;right:-6px;box-shadow:0 0 0 2px #07090C}
[data-ts=xl] .ph-bar h2{font-size:calc(var(--fs-body)*1.6)}
[data-ts=xl] .ph-cap .in{font-size:calc(var(--fs-body)*1.8)}
@container (min-width:600px){
 .ph-pv{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 64px));height:min(780px,calc(100% - 64px));border-radius:var(--r-xl);background:var(--surface);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 1px var(--line);padding:8px 8px 4px}
 .ph-th[aria-current=true],.ph-n,.ph-send .pc-badge{--pvbg:var(--surface)}
 .ph-th[aria-current=true]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--acc)}
 .ph-n{box-shadow:0 0 0 1.5px var(--surface)}.ph-send .pc-badge{box-shadow:0 0 0 2px var(--surface)}
 .ph-cap .in{background:var(--raised)}
}
</style>
